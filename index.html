<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>滑动切图 · 视频过渡</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;
    overflow:hidden;
    background:#08090b;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    touch-action:none;              /* 阻止移动端整页滚动，滑动只用来触发事件 */
  }
  img,video{display:block}

  /* ============ 全屏舞台 ============ */
  .stage{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
    isolation:isolate;
  }

  /* ============ 图片层 ============ */
  .layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;               /* 保持比例，不拉伸变形 */
    opacity:0;
    will-change:opacity;
    transform:translateZ(0);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  .layer.is-active{opacity:1}

  /* ============ 过渡视频层 ============ */
  .fx{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;               /* 原始比例铺满屏幕，不压缩画质 */
    opacity:0;
    pointer-events:none;
    z-index:2;
    will-change:opacity;
    transform:translateZ(0);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    image-rendering:auto;           /* 不主动缩放，保留原始画面质量 */

    /* 如果你的过渡视频是「黑底光效 / 粒子 / 扫光」，
       可打开下面这行让黑色自动透明，融合更自然： */
    /* mix-blend-mode:screen; */
  }

  /* ============ HUD ============ */
  .hud{
    position:fixed;
    left:0;right:0;top:0;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:24px 30px;
    pointer-events:none;
    mix-blend-mode:difference;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
  }
  .hud .brand{opacity:.9}
  .hud .counter{
    font-variant-numeric:tabular-nums;
    display:flex;
    gap:8px;
    opacity:.9;
  }
  .hud .counter .sep{opacity:.4}

  /* ============ 底部进度条 ============ */
  .progress{
    position:fixed;
    left:0;right:0;bottom:0;
    height:2px;
    z-index:10;
    background:rgba(255,255,255,.14);
  }
  .progress .bar-fill{
    height:100%;
    width:100%;
    background:#fff;
    transform-origin:0 50%;
    transform:scaleX(0);
    will-change:transform;
    transition:transform .5s cubic-bezier(.22,1,.36,1);
  }

  /* ============ 滑动提示 ============ */
  .scroll-hint{
    position:fixed;
    left:50%;
    bottom:40px;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    font-size:10px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:#fff;
    opacity:.75;
    mix-blend-mode:difference;
    pointer-events:none;
    transition:opacity .35s ease;
  }
  .scroll-hint::after{
    content:"";
    width:1px;
    height:40px;
    background:currentColor;
    transform-origin:top center;
    animation:hintLine 1.9s ease-in-out infinite;
  }
  @keyframes hintLine{
    0%  {transform:scaleY(0);opacity:0}
    45% {transform:scaleY(1);opacity:1}
    100%{transform:scaleY(1);opacity:0}
  }

  @media (max-width:640px){
    .hud{padding:18px 20px;font-size:10px}
    .scroll-hint{bottom:28px}
  }
</style>
</head>
<body>

<!-- 顶部 HUD -->
<div class="hud">
  <div class="brand"></div>
  <div class="counter">
    <span id="pageNow"></span>
    <span class="sep"></span>
    <span id="pageTotal"></span>
  </div>
</div>

<!-- 舞台 -->
<div class="stage">

  <!-- ===== 4 张图片 ===== -->
    <img class="layer is-active" src="1.png" alt="">
    <img class="layer" src="2.png" alt="">
    <img class="layer" src="3.png" alt="">
    <img class="layer" src="4.png" alt="">

  <!-- ===== 3 段过渡视频（各 4s，请替换成你自己的 mp4） ===== -->
  <video class="fx" muted playsinline webkit-playsinline preload="auto"
         disablepictureinpicture controlslist="nodownload"
         src="1-2.mp4"></video>

  <video class="fx" muted playsinline webkit-playsinline preload="auto"
         disablepictureinpicture controlslist="nodownload"
         src="2-3.mp4"></video>

  <video class="fx" muted playsinline webkit-playsinline preload="auto"
         disablepictureinpicture controlslist="nodownload"
         src="3-4.mp4"></video>

</div>

<!-- 进度条 -->
<div class="progress"><div class="bar-fill" id="bar"></div></div>

<!-- 滑动提示 -->
<div class="scroll-hint" id="hint">滑动</div>

<script>
(function(){
  'use strict';

  /* ==========================================================
     元素引用
     ========================================================== */
  var layers    = Array.prototype.slice.call(document.querySelectorAll('.layer'));
  var fxs       = Array.prototype.slice.call(document.querySelectorAll('.fx'));
  var N         = layers.length;              // 4 张图片
  var pageNow   = document.getElementById('pageNow');
  var pageTotal = document.getElementById('pageTotal');
  var bar       = document.getElementById('bar');
  var hint      = document.getElementById('hint');

  pageTotal.textContent = pad(N);

  /* ==========================================================
     状态
     ========================================================== */
  var currentIdx    = 0;      // 当前图片索引 0..3
  var locked        = false;  // 过渡进行中，忽略新的滑动
  var transitioning = false;  // 给 unlock 判断用

  function pad(n){ return (n < 10 ? '0' : '') + n; }

  function updateUI(){
    pageNow.textContent = pad(currentIdx + 1);
    bar.style.transform = 'scaleX(' + (currentIdx / (N - 1)).toFixed(4) + ')';
  }

  /* ==========================================================
     iOS / 移动端解锁自动播放
     —— 必须有一次用户手势触发的 play()，否则后续 seek / play 可能无效
     ========================================================== */
  var unlocked = false;
  function unlock(){
    if (unlocked) return;
    unlocked = true;

    fxs.forEach(function(v){
      var p = v.play();
      if (p && typeof p.then === 'function'){
        p.then(function(){
          if (transitioning) return;      // 正在过渡就别打断
          v.pause();
          try { v.currentTime = 0; } catch(e){}
        }).catch(function(){});
      }
    });
  }

  /* ==========================================================
     核心：一次滑动 = 一次完整过渡
     dir =  1 → 下一张（视频正放）
     dir = -1 → 上一张（视频倒放）
     ========================================================== */
  function transition(dir){
    if (locked) return;

    var target = currentIdx + dir;
    if (target < 0 || target >= N) return;   // 边界不动作

    locked = true;
    transitioning = true;
    hint.style.opacity = '0';

    // 当前图片 → 目标图片，使用哪段视频
    var segIdx = dir > 0 ? currentIdx : currentIdx - 1;
    var v      = fxs[segIdx];
    var dur    = (isFinite(v.duration) && v.duration > 0) ? v.duration : 4;

    var switched = false;
    var faded    = false;
    var finished = false;

    // 安全兜底：万一视频事件丢失，也能解锁
    var safetyTimer = setTimeout(function(){
      if (!finished){ doSwitch(); fadeOut(); }
    }, (dur + 2) * 1000);

    // 视频快速淡入
    v.style.transition = 'opacity 0.16s ease';
    v.style.opacity    = '1';

    /* ---------- 切换图片（视频完全遮住时执行） ---------- */
    function doSwitch(){
      if (switched) return;
      switched = true;

      layers[currentIdx].classList.remove('is-active');
      currentIdx = target;
      layers[currentIdx].classList.add('is-active');

      updateUI();
    }

    /* ---------- 视频淡出并解锁 ---------- */
    function fadeOut(){
      if (faded) return;
      faded = true;

      v.style.transition = 'opacity 0.3s ease';
      v.style.opacity    = '0';

      setTimeout(function(){
        if (finished) return;
        finished = true;
        clearTimeout(safetyTimer);

        locked        = false;
        transitioning = false;
        v.style.transition = '';
      }, 320);
    }

    /* ---------- 正向：原生播放，最流畅 ---------- */
    if (dir > 0){
      try { v.currentTime = 0; } catch(e){}

      var p = v.play();
      if (p && typeof p.catch === 'function'){
        p.catch(function(){
          // 自动播放被拦截时的兜底
          doSwitch();
          fadeOut();
        });
      }

      (function tick(){
        if (finished) return;
        var t = v.currentTime;

        if (!switched && t >= dur * 0.5)       doSwitch();
        if (!faded    && t >= dur - 0.32)      fadeOut();

        if (!v.ended && !v.paused) requestAnimationFrame(tick);
      })();

      v.onended = function(){
        v.onended = null;
        doSwitch();
        fadeOut();
      };
    }
    /* ---------- 反向：rAF seek 倒放 ---------- */
    else {
      v.pause();

      var t = dur - 0.04;
      try { v.currentTime = t; } catch(e){}

      (function step(){
        if (finished) return;

        t -= 1 / 30;                        // 30fps 步进

        if (t <= 0){
          doSwitch();
          fadeOut();
          try { v.currentTime = 0; } catch(e){}
          return;
        }

        if (!switched && t <= dur * 0.5)  doSwitch();
        if (!faded    && t <= 0.32)       fadeOut();

        try { v.currentTime = t; } catch(e){}
        requestAnimationFrame(step);
      })();
    }
  }

  /* ==========================================================
     视频预加载：提前把首帧解码出来
     ========================================================== */
  fxs.forEach(function(v){
    v.addEventListener('loadedmetadata', function(){
      try { v.currentTime = 0.001; } catch(e){}
    });
    v.addEventListener('error', function(){
      console.warn('过渡视频加载失败：', v.src);
    });
  });

  /* ==========================================================
     输入一：鼠标滚轮 / 触控板
     ========================================================== */
  var acc       = 0;
  var accTimer  = null;
  var WHEEL_THRESHOLD = 40;

  window.addEventListener('wheel', function(e){
    e.preventDefault();                     // 阻止页面滚动
    unlock();
    if (locked) return;

    acc += e.deltaY;
    clearTimeout(accTimer);
    accTimer = setTimeout(function(){ acc = 0; }, 140);

    if (Math.abs(acc) > WHEEL_THRESHOLD){
      var dir = acc > 0 ? 1 : -1;
      acc = 0;
      transition(dir);
    }
  }, { passive:false });

  /* ==========================================================
     输入二：触摸滑动
     ========================================================== */
  var touchStartY = 0;
  var touchStartX = 0;

  window.addEventListener('touchstart', function(e){
    unlock();
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
  }, { passive:true });

  window.addEventListener('touchend', function(e){
    if (locked) return;

    var dy = touchStartY - e.changedTouches[0].clientY;
    var dx = touchStartX - e.changedTouches[0].clientX;

    // 纵向滑动、且超过最小距离
    if (Math.abs(dy) < 36 || Math.abs(dy) < Math.abs(dx) * 0.8) return;

    transition(dy > 0 ? 1 : -1);
  }, { passive:true });

  /* ==========================================================
     输入三：键盘（方便调试）
     ========================================================== */
  window.addEventListener('keydown', function(e){
    unlock();
    if (locked) return;

    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' '){
      e.preventDefault();
      transition(1);
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft'){
      e.preventDefault();
      transition(-1);
    }
  });

  /* ==========================================================
     初始化
     ========================================================== */
  updateUI();

})();
</script>
</body>
</html>
